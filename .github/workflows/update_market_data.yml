name: Update market data

on:
  schedule:
    # 18:00 Taiwan (UTC+8) weekdays. T86 / margin / 5-sec index are usually out by then.
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      days:
        description: 'Calendar days to catch up (14 for daily, 730 for first historical fill)'
        required: false
        default: '14'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: update-market-data
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore market databases
        uses: actions/cache/restore@v4
        with:
          path: |
            twse_data.db
            us_data.db
          key: market-data-${{ github.run_id }}
          restore-keys: |
            market-data-

      - name: Catch up market data
        env:
          DAYS: ${{ github.event.inputs.days || '14' }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python update_market_data.py --days "$DAYS" --include-today

      - name: Save market databases
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            twse_data.db
            us_data.db
          key: market-data-${{ github.run_id }}

      - name: Upload market data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data
          path: |
            twse_data.db
            us_data.db
          if-no-files-found: warn
          retention-days: 90
