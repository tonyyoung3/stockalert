name: Update market data

on:
  schedule:
    # GitHub cron is UTC. 10:00 UTC = 18:00 Asia/Taipei (no DST).
    # Listed + OTC daily prices live in this job (stock_daily), not a second pipeline.
    # T86 / margin / 5-sec index / MI_INDEX / TPEX quotes are usually out by then.
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      days:
        description: 'Calendar days to catch up (14 for daily, 730 for first historical fill)'
        required: false
        default: '14'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: update-market-data
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore market databases
        uses: actions/cache/restore@v4
        with:
          path: |
            twse_data.db
            us_data.db
          key: market-data-${{ github.run_id }}
          restore-keys: |
            market-data-

      - name: Catch up market data
        env:
          TZ: Asia/Taipei
          DAYS: ${{ github.event.inputs.days || '14' }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -o pipefail
          python -m market.update_market_data --days "$DAYS" --include-today 2>&1 | tee market-update.log

      - name: Save market databases
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            twse_data.db
            us_data.db
          key: market-data-${{ github.run_id }}

      - name: Upload market data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data
          path: |
            twse_data.db
            us_data.db
          if-no-files-found: warn
          retention-days: 90

      - name: Notify Slack on failure
        if: failure() || cancelled()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m notify.notify_job --title "市場資料更新失敗" --log market-update.log

  # ---------------------------------------------------------------------------
  # broker-branch / 分點買賣超 — NOT ENABLED (issue #54 / epic #53)
  # Blocker: FINMIND_TOKEN is absent from GitHub secrets. Owner has not
  # decided token + 大盤 vs 個股. Do not add a cron that calls FinMind.
  # If later enabled (after that decision):
  #   - weekday after FinMind post-close ~21:00 Asia/Taipei (13:00 UTC)
  #   - do NOT fold into the 18:00 update-market-data job
  #   - 熱門前 N uses latest stock_daily.turnover; title 「熱門股分點動向」
  #   - reuse this file's Slack failure notify pattern
  #   - then Turso push if secrets are set
  #   - see docs/broker_branch.md
  # ---------------------------------------------------------------------------
