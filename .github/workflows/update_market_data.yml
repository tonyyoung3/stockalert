name: Update market data

on:
  schedule:
    # GitHub cron is UTC. 10:00 UTC = 18:00 Asia/Taipei (no DST).
    # Listed + OTC daily prices live in this job (stock_daily), not a second pipeline.
    # T86 / margin / 5-sec index / MI_INDEX / TPEX quotes are usually out by then.
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      days:
        description: 'Calendar days to catch up (14 for daily, 730 for first historical fill)'
        required: false
        default: '14'
      institutional_gaps:
        description: >-
          Only fill trust_daily/dealer_daily dates missing vs foreign_daily
          (Turso foreign span when TURSO_* is set; Actions cache local foreign
          span is often shorter). Skips other jobs.
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: update-market-data
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore market databases
        uses: actions/cache/restore@v4
        with:
          path: |
            twse_data.db
            us_data.db
          key: market-data-${{ github.run_id }}
          restore-keys: |
            market-data-

      - name: Catch up market data
        env:
          TZ: Asia/Taipei
          DAYS: ${{ github.event.inputs.days || '14' }}
          INSTITUTIONAL_GAPS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.institutional_gaps || 'false' }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # Historical T86 from Actions IPs often returns empty/HTML, not JSON.
          # institutional_gaps uses FinMind (TaiwanStockInstitutionalInvestorsBuySell).
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          set -o pipefail
          if [ "$INSTITUTIONAL_GAPS" = "true" ]; then
            python -m market.update_market_data --institutional-gaps-only --include-today 2>&1 | tee market-update.log
          else
            python -m market.update_market_data --days "$DAYS" --include-today 2>&1 | tee market-update.log
          fi

      - name: Save market databases
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            twse_data.db
            us_data.db
          key: market-data-${{ github.run_id }}

      - name: Upload market data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data
          path: |
            twse_data.db
            us_data.db
          if-no-files-found: warn
          retention-days: 90

      - name: Notify Slack on failure
        if: failure() || cancelled()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m notify.notify_job --title "市場資料更新失敗" --log market-update.log

  # broker-branch / 熱門股分點動向 lives in update_broker_branch.yml (#61).
  # Weekday ~21:00 Asia/Taipei — do NOT fold FinMind calls into this 18:00 job.
