name: Run screener on schedule

on:
  schedule:
    # After TW close: 9 PM Taiwan (UTC+8) = 1 PM UTC
    - cron: '0 13 * * *'
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    # Prevent overlapping runs if a previous one is still executing
    concurrency:
      group: run-screener
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore alert database from cache
        uses: actions/cache/restore@v4
        with:
          path: screener.db
          key: screener-db-${{ github.run_id }}
          restore-keys: |
            screener-db-

      - name: Restore alert database from last artifact
        if: hashFiles('screener.db') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=$(gh run list \
            --workflow run_screener.yml \
            --branch "${{ github.ref_name }}" \
            --status success \
            --limit 10 \
            --json databaseId \
            --jq '.[0].databaseId' || true)
          if [ -n "${RUN_ID:-}" ]; then
            gh run download "$RUN_ID" --name screener-db || true
          fi

      - name: Seed database if missing
        run: |
          if [ -f screener.db ]; then
            echo "Using existing screener.db"
          else
            cp screener.seed.db screener.db
            echo "No cache or artifact; seeded screener.db from screener.seed.db"
          fi

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run screener
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
        run: python screener.py

      - name: Check alert performance
        run: python performance_checker.py

      - name: Save alert database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: screener.db
          key: screener-db-${{ github.run_id }}

      - name: Upload alert database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-db
          path: screener.db
          retention-days: 90
