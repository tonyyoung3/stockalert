name: Run screener on schedule

on:
  schedule:
    # 13:30 Taiwan weekdays: Yahoo daily Close is usually still present.
    - cron: '30 5 * * 1-5'
    # 21:00 Taiwan. GitHub often delays cron by hours; keep a backup.
    - cron: '0 13 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Restore screener database
        uses: actions/cache/restore@v4
        with:
          path: screener.db
          key: screener-db-${{ github.run_id }}
          restore-keys: |
            screener-db-

      - name: Restore market databases
        uses: actions/cache/restore@v4
        with:
          path: |
            twse_data.db
            us_data.db
          key: market-data-${{ github.run_id }}
          restore-keys: |
            market-data-

      - name: Seed screener.db from git history if cache miss
        run: |
          if [ -f screener.db ]; then
            echo "screener.db already present"
            exit 0
          fi
          echo "No cached screener.db; trying last git copy (transition after untracking)"
          for sha in $(git log --pretty=format:%H -- screener.db); do
            if git cat-file -e "$sha:screener.db" 2>/dev/null; then
              git checkout "$sha" -- screener.db
              echo "Seeded screener.db from $sha"
              exit 0
            fi
          done
          echo "No historical screener.db found; starting empty (Turso upsert will not delete remote rows)"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run screener
        env:
          TZ: Asia/Taipei
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Checking SLACK_WEBHOOK_URL..."
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is set (length: ${#SLACK_WEBHOOK_URL})"
          else
            echo "SLACK_WEBHOOK_URL is NOT set"
          fi
          python -m notify.screener

      - name: Check alert performance
        env:
          TZ: Asia/Taipei
        run: python -m notify.performance_checker

      - name: Run scanner daily alert
        env:
          TZ: Asia/Taipei
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -o pipefail
          python -m notify.scanner_alert 2>&1 | tee scanner-alert.log

      - name: Notify Slack on scanner-alert failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m notify.notify_job --title "掃描每日告警失敗" --log scanner-alert.log

      - name: Save screener database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: screener.db
          key: screener-db-${{ github.run_id }}

      - name: Upload screener database artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-db
          path: screener.db
          if-no-files-found: warn
          retention-days: 90

      - name: Push alerts to Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python -m data.cloud_db push-alerts

    # Prevent overlapping runs if a previous one is still executing
    concurrency:
      group: run-screener
      cancel-in-progress: false
