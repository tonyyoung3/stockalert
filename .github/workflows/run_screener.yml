name: Run screener on schedule

on:
  schedule:
    # Runs daily at 9 PM Taiwan time (UTC+8) = 1 PM UTC
    - cron: '0 13 * * *'
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need a token with write access so we can push screener.db back
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run screener
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
        run: |
          echo "Checking SLACK_WEBHOOK_URL..."
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is set (length: ${#SLACK_WEBHOOK_URL})"
          else
            echo "SLACK_WEBHOOK_URL is NOT set"
          fi
          python screener.py

      - name: Check alert performance
        run: python performance_checker.py

      - name: Persist alert database
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screener.db
          # Only commit if screener.db actually changed
          git diff --cached --quiet || git commit -m "chore: update screener.db [skip ci]"
          git push

    # Prevent overlapping runs if a previous one is still executing
    concurrency:
      group: run-screener
      cancel-in-progress: false


