name: Update broker-branch (熱門股分點動向)

on:
  schedule:
    # GitHub cron is UTC. 13:00 UTC = 21:00 Asia/Taipei (no DST).
    # FinMind TaiwanStockTradingDailyReportSecIdAgg is documented ~21:00.
    # Do NOT fold this into the 18:00 update-market-data job: stock_daily
    # must already be written so 熱門前 N can be selected from turnover.
    - cron: '0 13 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Trade date YYYY-MM-DD (blank = expected 21:00 cutoff day)'
        required: false
        default: ''
      n:
        description: 'Hot-N count (blank = BROKER_BRANCH_HOT_N or 80)'
        required: false
        default: ''
      days:
        description: 'Trading days to ingest ending at date (default 1)'
        required: false
        default: '1'

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: update-broker-branch
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore market databases
        uses: actions/cache/restore@v4
        with:
          path: |
            twse_data.db
            us_data.db
          key: market-data-${{ github.run_id }}
          restore-keys: |
            market-data-

      - name: Ingest 熱門股分點動向
        env:
          TZ: Asia/Taipei
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          BROKER_BRANCH_HOT_N: ${{ github.event.inputs.n }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -o pipefail
          if [ -z "${FINMIND_TOKEN}" ]; then
            echo "FINMIND_TOKEN is not set; refusing to call FinMind. Dashboard reads DB only."
            exit 2
          fi
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi
          N_ARG=""
          if [ -n "${{ github.event.inputs.n }}" ]; then
            N_ARG="--n ${{ github.event.inputs.n }}"
          fi
          DAYS="${{ github.event.inputs.days || '1' }}"
          python -m market.broker_branch ingest $DATE_ARG $N_ARG --days "$DAYS" 2>&1 | tee broker-branch-ingest.log

      - name: Save market databases
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            twse_data.db
            us_data.db
          key: market-data-${{ github.run_id }}

      - name: Notify Slack on failure
        if: failure() || cancelled()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m notify.notify_job --title "熱門股分點動向更新失敗" --log broker-branch-ingest.log
